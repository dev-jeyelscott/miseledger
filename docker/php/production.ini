expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL

; Coolify injects application configuration as container environment variables.
variables_order=EGPCS

; Application code and vendor dependencies are immutable inside the image.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.revalidate_freq=0
