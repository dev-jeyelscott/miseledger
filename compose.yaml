services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        WWWUSER: '${WWWUSER:-1000}'
        WWWGROUP: '${WWWGROUP:-1000}'
    image: miseledger-dev
    environment:
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
      DOCKER_DEV: '1'
      VITE_HOST: '${VITE_HOST:-0.0.0.0}'
      VITE_HMR_HOST: '${VITE_HMR_HOST:-localhost}'
      VITE_HMR_PORT: '${VITE_HMR_PORT:-${VITE_PORT:-5174}}'
      VITE_USE_POLLING: '${VITE_USE_POLLING:-false}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8002}:8080'
    volumes:
      - '.:/var/www/html'
    networks:
      - miseledger
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          '--show-error',
          'http://127.0.0.1:8080/up',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: miseledger-dev
    environment:
      XDEBUG_MODE: 'off'
      DOCKER_DEV: '1'
    volumes:
      - '.:/var/www/html'
    networks:
      - miseledger
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        'php',
        'artisan',
        'queue:work',
        'redis',
        '--sleep=1',
        '--tries=3',
        '--timeout=90',
      ]
    restart: unless-stopped

  scheduler:
    image: miseledger-dev
    environment:
      XDEBUG_MODE: 'off'
      DOCKER_DEV: '1'
    volumes:
      - '.:/var/www/html'
    networks:
      - miseledger
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['php', 'artisan', 'schedule:work']
    restart: unless-stopped

  vite:
    image: miseledger-dev
    environment:
      XDEBUG_MODE: 'off'
      DOCKER_DEV: '1'
      VITE_HOST: '${VITE_HOST:-0.0.0.0}'
      VITE_HMR_HOST: '${VITE_HMR_HOST:-localhost}'
      VITE_HMR_PORT: '${VITE_HMR_PORT:-${VITE_PORT:-5174}}'
      VITE_USE_POLLING: '${VITE_USE_POLLING:-false}'
    ports:
      - '${VITE_PORT:-5174}:${VITE_PORT:-5174}'
    volumes:
      - '.:/var/www/html'
    networks:
      - miseledger
    command: ['npm', 'run', 'dev']
    restart: unless-stopped

  pgsql:
    image: 'postgres:18-alpine'
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-5433}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-miseledger}'
      POSTGRES_DB: '${DB_DATABASE:-miseledger}'
      POSTGRES_USER: '${DB_USERNAME:-miseledger}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-miseledger}'
    volumes:
      - 'sail-pgsql:/var/lib/postgresql/data'
      - './docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro'
    networks:
      - miseledger
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -q -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: 'redis:7-alpine'
    ports:
      - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - miseledger
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  miseledger:
    driver: bridge

volumes:
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
