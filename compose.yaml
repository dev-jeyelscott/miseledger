services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        WWWUSER: '${WWWUSER:-1000}'
        WWWGROUP: '${WWWGROUP:-1000}'
    image: miseledger-dev
    environment:
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
      DOCKER_DEV: '1'
      VITE_HOST: '${VITE_HOST:-0.0.0.0}'
      VITE_HMR_HOST: '${VITE_HMR_HOST:-localhost}'
      VITE_HMR_PORT: '${VITE_HMR_PORT:-${VITE_PORT:-5174}}'
      VITE_USE_POLLING: '${VITE_USE_POLLING:-false}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8002}:8080'
    volumes:
      - '.:/var/www/html'
    networks:
      - miseledger
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          '--show-error',
          'http://127.0.0.1:8080/up',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: miseledger-dev
    environment:
      XDEBUG_MODE: 'off'
      DOCKER_DEV: '1'
    volumes:
      - '.:/var/www/html'
    networks:
      - miseledger
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        'php',
        'artisan',
        'queue:work',
        'redis',
        '--sleep=1',
        '--tries=3',
        '--timeout=90',
      ]
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-worker
    image: miseledger-ai-worker-dev
    environment:
      DOCKER_DEV: '1'
      # This image has no bind-mounted .env (by design, for its read-only,
      # capability-dropped posture), so the framework env it needs to boot
      # and reach shared infra is passed explicitly here instead, sourced
      # from the same root .env the other dev services read directly.
      APP_ENV: '${APP_ENV:-local}'
      APP_NAME: '${APP_NAME:-MiseLedger}'
      APP_KEY: '${APP_KEY}'
      DB_CONNECTION: '${DB_CONNECTION:-pgsql}'
      DB_HOST: '${DB_HOST:-pgsql}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_DATABASE: '${DB_DATABASE:-miseledger}'
      DB_USERNAME: '${DB_USERNAME:-miseledger}'
      DB_PASSWORD: '${DB_PASSWORD:-miseledger}'
      REDIS_HOST: '${REDIS_HOST:-redis}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
      CACHE_STORE: '${CACHE_STORE:-database}'
      AI_CODEX_PROFILE_ROOT: /var/lib/miseledger/codex/profiles
      AI_CODEX_WORKSPACE: /tmp/codex-workspace
      AI_CODEX_TIMEOUT_SECONDS: '75'
      AI_REDIS_QUEUE_CONNECTION: default
      AI_QUEUE: ai
      AI_QUEUE_RETRY_AFTER: '960'
    tmpfs:
      # Codex's Linux sandbox creates transient Bubblewrap mount targets
      # directly under /tmp before it launches the local MCP server.
      - /tmp:mode=1777
      - /var/www/html/storage:mode=0770,uid=10001,gid=10001
      - /var/www/html/bootstrap/cache:mode=0770,uid=10001,gid=10001
      # Provider authentication profiles are deliberately per-worker and
      # disposable. They must never survive worker replacement or be shared
      # with another service.
      - /var/lib/miseledger/codex/profiles:mode=0700,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Codex code-mode starts a separate host with its own runtime threads.
    # Keep a hard cap, but leave sufficient headroom for that local process.
    pids_limit: 256
    cpus: 2.0
    mem_limit: 2g
    networks:
      - miseledger
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        'php',
        'artisan',
        'queue:work',
        'ai',
        '--sleep=1',
        '--tries=3',
        '--timeout=190',
      ]
    restart: unless-stopped

  ai-login-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-worker
    image: miseledger-ai-worker-dev
    environment:
      DOCKER_DEV: '1'
      APP_ENV: '${APP_ENV:-local}'
      APP_NAME: '${APP_NAME:-MiseLedger}'
      APP_KEY: '${APP_KEY}'
      DB_CONNECTION: '${DB_CONNECTION:-pgsql}'
      DB_HOST: '${DB_HOST:-pgsql}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_DATABASE: '${DB_DATABASE:-miseledger}'
      DB_USERNAME: '${DB_USERNAME:-miseledger}'
      DB_PASSWORD: '${DB_PASSWORD:-miseledger}'
      REDIS_HOST: '${REDIS_HOST:-redis}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
      CACHE_STORE: '${CACHE_STORE:-database}'
      AI_CODEX_PROFILE_ROOT: /var/lib/miseledger/codex/profiles
      AI_CODEX_WORKSPACE: /tmp/codex-workspace
      AI_CODEX_TIMEOUT_SECONDS: '75'
      AI_REDIS_QUEUE_CONNECTION: default
      AI_QUEUE: ai
      AI_QUEUE_RETRY_AFTER: '960'
    tmpfs:
      - /tmp:mode=1777
      - /var/www/html/storage:mode=0770,uid=10001,gid=10001
      - /var/www/html/bootstrap/cache:mode=0770,uid=10001,gid=10001
      - /var/lib/miseledger/codex/profiles:mode=0700,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 2.0
    mem_limit: 2g
    networks:
      - miseledger
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        'php',
        'artisan',
        'queue:work',
        'ai',
        '--queue=ai-login',
        '--sleep=1',
        '--tries=1',
        '--timeout=930',
      ]
    restart: unless-stopped


  scheduler:
    image: miseledger-dev
    environment:
      XDEBUG_MODE: 'off'
      DOCKER_DEV: '1'
    volumes:
      - '.:/var/www/html'
    networks:
      - miseledger
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['php', 'artisan', 'schedule:work']
    restart: unless-stopped

  vite:
    image: miseledger-dev
    environment:
      XDEBUG_MODE: 'off'
      DOCKER_DEV: '1'
      VITE_HOST: '${VITE_HOST:-0.0.0.0}'
      VITE_HMR_HOST: '${VITE_HMR_HOST:-localhost}'
      VITE_HMR_PORT: '${VITE_HMR_PORT:-${VITE_PORT:-5174}}'
      VITE_USE_POLLING: '${VITE_USE_POLLING:-false}'
    ports:
      - '${VITE_PORT:-5174}:${VITE_PORT:-5174}'
    volumes:
      - '.:/var/www/html'
    networks:
      - miseledger
    command: ['npm', 'run', 'dev']
    restart: unless-stopped

  pgsql:
    image: 'postgres:18-alpine'
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-5433}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-miseledger}'
      POSTGRES_DB: '${DB_DATABASE:-miseledger}'
      POSTGRES_USER: '${DB_USERNAME:-miseledger}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-miseledger}'
    volumes:
      - 'sail-pgsql:/var/lib/postgresql/data'
      - './docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro'
    networks:
      - miseledger
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -q -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: 'redis:7-alpine'
    ports:
      - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - miseledger
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  miseledger:
    driver: bridge

volumes:
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
