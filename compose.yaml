x-app-build: &app-build
    context: .
    dockerfile: Dockerfile
    target: development
    args:
        WWWUSER: '${WWWUSER:-1000}'
        WWWGROUP: '${WWWGROUP:-1000}'

x-app-service: &app-service
    build: *app-build
    image: miseledger:development
    pull_policy: never
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        DOCKER_DEV: '1'
        VITE_PORT: '${VITE_PORT:-5174}'
        VITE_HMR_HOST: '${VITE_HMR_HOST:-localhost}'
        VITE_USE_POLLING: '${VITE_USE_POLLING:-false}'
        XDEBUG_MODE: '${XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
    volumes:
        - '.:/var/www/html'
    networks:
        - miseledger
    depends_on:
        pgsql:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    app:
        <<: *app-service
        command: apache2-foreground
        ports:
            - '${APP_PORT:-8002}:8080'
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '--fail',
                    '--silent',
                    '--show-error',
                    'http://127.0.0.1:8080/up',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    worker:
        <<: *app-service
        command:
            [
                'php',
                'artisan',
                'queue:work',
                'redis',
                '--sleep=1',
                '--tries=3',
                '--timeout=90',
            ]
        restart: unless-stopped

    scheduler:
        <<: *app-service
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped

    vite:
        <<: *app-service
        command: ['npm', 'run', 'dev']
        ports:
            - '${VITE_PORT:-5174}:${VITE_PORT:-5174}'
        restart: unless-stopped

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-miseledger}'
            POSTGRES_DB: '${DB_DATABASE:-miseledger}'
            POSTGRES_USER: '${DB_USERNAME:-miseledger}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-miseledger}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro'
        networks:
            - miseledger
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -q -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"',
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: 'redis:8-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - miseledger
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    miseledger:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
