name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: miseledger_testing
      DB_USERNAME: miseledger
      DB_PASSWORD: miseledger
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: miseledger_testing
          POSTGRES_USER: miseledger
          POSTGRES_PASSWORD: miseledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miseledger -d miseledger_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.9'
          extensions: pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Run CI Checks
        run: composer ci:check
