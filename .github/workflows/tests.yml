name: tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: miseledger_test
          POSTGRES_USER: miseledger
          POSTGRES_PASSWORD: miseledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miseledger -d miseledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: miseledger_test
      DB_USERNAME: miseledger
      DB_PASSWORD: miseledger

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: bcmath, curl, dom, fileinfo, mbstring, openssl, pcntl, pdo_pgsql, posix, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Prepare Application Environment
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Application
        run: |
          php artisan key:generate
          npm ci
          npm run build

      - name: Run Backend Format Check
        run: composer format:check

      - name: Run Static Analysis
        run: composer types:check

      - name: Run Tests
        run: composer test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: miseledger_test
          POSTGRES_USER: miseledger
          POSTGRES_PASSWORD: miseledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miseledger -d miseledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: miseledger_test
      DB_USERNAME: miseledger
      DB_PASSWORD: miseledger

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8002

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: bcmath, curl, dom, fileinfo, mbstring, openssl, pcntl, pdo_pgsql, posix, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Prepare Application Environment
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Application
        run: |
          php artisan key:generate
          npm ci
          npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start application server
        run: php artisan serve --host=127.0.0.1 --port=8002 &

      - name: Run Playwright E2E suite
        run: npm run test:e2e
